<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка проекта — реестр</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/theme.js?v=dark-1"></script>
<link rel="stylesheet" href="/project.css?v=dark-1">
<link rel="stylesheet" href="/theme.css?v=dark-1">
<link rel="stylesheet" href="/project-documents.css?v=documents-1">
</head><body>
  <svg style="display:none" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></symbol>
    <symbol id="icon-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6z"/><path d="M17 11h1"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16v1"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" href="/index.html" id="overview-brand"><div class="brand-mark" aria-hidden="true"></div><div class="brand-name">Реестровые записи</div><div class="brand-divider"></div><div class="brand-caption">Карточка проекта</div></a>
    <div class="page-tools"><a class="button" href="/index.html" id="overview-link">← Все проекты</a><label class="snapshot" for="snapshot-date"><span id="snapshot-label">Срез на дату</span><input type="date" id="snapshot-date" required></label><button class="theme-toggle" type="button" data-theme-toggle aria-label="Включить тёмную тему"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Тёмная тема</span></button></div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Выбор проекта">
      <div class="sidebar-inner">
        <div class="sidebar-heading"><h2>Проекты</h2><span class="count" id="project-count"></span></div>
        <div class="search-wrap"><svg><use href="#icon-search"/></svg><input id="search" type="search" placeholder="Найти проект" aria-label="Поиск проекта"></div>
        <nav class="project-list" id="project-list" aria-label="Проекты реестра"></nav>
        <div class="sidebar-note">Выберите проект, чтобы посмотреть его этапы, сроки и историю.</div>
      </div>
    </aside>
    <main id="main"><div class="loading-state" role="status">Загружаем данные реестра…</div></main>
  </div>
  <dialog class="history-dialog" id="history-dialog" aria-labelledby="history-title">
    <div class="dialog-head"><div><h2 id="history-title">История проекта</h2><p id="history-subtitle"></p></div><button class="dialog-close" id="close-history" aria-label="Закрыть историю">×</button></div>
    <ol class="history-list" id="full-history"></ol>
  </dialog>

  <dialog class="editor-dialog" id="editor-dialog" aria-labelledby="editor-title">
    <form id="editor-form">
      <h2 id="editor-title"></h2><p class="editor-subtitle" id="editor-subtitle"></p>
      <div id="editor-fields"></div><div class="editor-error" id="editor-error" role="alert" hidden></div>
      <div class="editor-actions"><button class="button" type="button" id="cancel-editor">Отмена</button><button class="button button-primary" id="save-editor" type="submit">Сохранить</button></div>
    </form>
  </dialog>
  <dialog class="critical-dialog" id="critical-dialog" aria-labelledby="critical-dialog-title">
    <form id="critical-form">
      <h2 id="critical-dialog-title">Новая критическая точка</h2>
      <p id="critical-dialog-project"></p>
      <div class="field"><label for="critical-date">Дата</label><input id="critical-date" name="date" type="date" required></div>
      <div class="field"><label for="critical-name">Событие</label><input id="critical-name" name="title" type="text" maxlength="120" placeholder="Например, ответ эксперта" required></div>
      <div class="editor-error" id="critical-error" role="alert" hidden></div>
      <div class="critical-actions"><button class="button critical-delete" id="critical-delete" type="button" hidden>Удалить</button><button class="button" id="critical-cancel" type="button">Отмена</button><button class="button button-primary" id="critical-save" type="submit">Сохранить</button></div>
    </form>
  </dialog>
  <dialog class="calendar-day-dialog" id="calendar-day-dialog" aria-labelledby="calendar-day-title">
    <div class="calendar-day-dialog-content">
      <div class="dialog-head"><div><span class="overline">События дня</span><h2 id="calendar-day-title"></h2></div><button class="dialog-close" id="calendar-day-close" aria-label="Закрыть">×</button></div>
      <ul class="calendar-day-list" id="calendar-day-events"></ul>
      <button class="button button-primary" id="calendar-day-add" type="button">+ Критическая точка</button>
    </div>
  </dialog>
  <div class="save-toast" id="save-toast" role="status" hidden></div>
  <script src="/vendor/motion.js?v=bd4822a8b54e"></script>
  <script src="/arc-motion.js?v=calendar-drag-1"></script>
  <script src="/project.js?v=calendar-drag-1"></script>
  <script src="/project-documents.js?v=documents-1"></script>
</body></html>
