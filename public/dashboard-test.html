    .shell{max-width:1510px;min-height:100vh;margin:auto;background:#f5f6f3;display:grid;grid-template-columns:226px minmax(0,1fr);box-shadow:0 16px 60px #24332518}.sidebar{background:var(--paper);border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;min-height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:0 14px 31px;font-family:Manrope,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.06em}.brand-mark{width:25px;height:25px;display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:2px;transform:rotate(-12deg)}.brand-mark i{background:var(--green);border-radius:2px}.brand-mark i:nth-child(1),.brand-mark i:nth-child(2),.brand-mark i:nth-child(4){opacity:.35}.brand-mark i:nth-child(3),.brand-mark i:nth-child(7){opacity:0}

    .main{padding:32px 36px 55px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:27px}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:3px}.topbar h1{font-family:Manrope,sans-serif;font-size:29px;line-height:1.2;letter-spacing:-.055em;margin:0}.top-actions{display:flex;align-items:center;gap:9px}.date-pill,.soft-btn{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 14px;font-weight:700;color:#59625b}.soft-btn:hover{border-color:#b5c2b5}.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--green);font-size:18px}.primary-btn{border:0;border-radius:999px;background:var(--green);color:#fff;padding:10px 17px;font-weight:800}.primary-btn:hover{background:#28533a}.source-note{margin:-11px 0 20px;color:#7b847b;font-size:12px}.source-note.demo{background:#fff7df;color:#7c631f;padding:9px 12px;border-radius:8px}.error-note{background:#fff1ed;color:#a64245;padding:13px 15px;border-radius:9px;margin-bottom:18px}
    .kpis{display:grid;grid-template-columns:1.25fr .75fr .75fr;gap:12px;margin-bottom:13px}.card{background:#fff;border:1px solid #e9ece7;border-radius:14px}.risk-card{min-height:200px;padding:21px 22px;background:var(--lime);position:relative;overflow:hidden}.risk-card:after{content:"";position:absolute;right:0;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,#d7e79c88 0 2px,transparent 2px 7px);mask-image:linear-gradient(90deg,transparent,#000)}.badge{display:inline-block;border-radius:999px;background:var(--green);color:#fff;padding:5px 10px;font-size:10px;font-weight:800}.risk-number{font-family:Manrope,sans-serif;font-size:40px;font-weight:800;letter-spacing:-.07em;line-height:1.18;margin:14px 0 2px}.risk-card p{max-width:260px;margin:0 0 16px;line-height:1.45;color:#45523e}.risk-card button{border:0;background:var(--green);color:#fff;border-radius:999px;padding:9px 14px;font-weight:800;position:relative;z-index:1}.metric-card{min-height:200px;padding:21px;display:flex;flex-direction:column;justify-content:space-between}.metric-card h3{font-size:12px;font-weight:700;margin:0;color:#5e695f}.metric-card strong{font-family:Manrope,sans-serif;font-size:36px;letter-spacing:-.06em;line-height:1}.metric-card small{color:#8a938b}.mini-bars{height:42px;display:flex;align-items:end;gap:4px}.mini-bars i{display:block;flex:1;background:#c9d9a0;border-radius:3px 3px 0 0}.mini-bars i:last-child{background:var(--green)}.completion-card{background:var(--violet);border-color:var(--violet);color:#fff}.completion-card h3,.completion-card small{color:#e8e7ff}.completion-card .mini-bars i{background:#dddafa}.completion-card .mini-bars i:last-child{background:#fff}
    .lower{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(285px,.8fr);gap:13px}.table-card,.breakdown{padding:19px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.section-head h2{font-family:Manrope,sans-serif;font-size:16px;letter-spacing:-.035em;margin:0}.section-head .link{border:0;background:none;font-weight:800;color:var(--green);font-size:11px}.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.filter{border:0;background:#f4f6f2;padding:7px 11px;border-radius:999px;color:#69736c;font-weight:700;font-size:11px}.filter.active{background:var(--green);color:white}.search{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;width:100%;margin-bottom:10px;color:var(--ink)}.search::placeholder{color:#a0a8a1}.table-wrap{overflow:auto}.project-table{width:100%;border-collapse:collapse;min-width:560px}.project-table th{text-align:left;color:#a0a8a1;font-size:10px;font-weight:800;padding:11px 8px;border-bottom:1px solid var(--line)}.project-table td{padding:12px 8px;border-bottom:1px solid #eef0ec;vertical-align:middle}.project-table tr:last-child td{border-bottom:0}.project-table tbody tr{cursor:pointer}.project-table tbody tr:hover{background:#f7f9f4}.project-name{font-weight:800}.project-sub{font-size:10px;color:#9ba39c;margin-top:3px}.status-chip{display:inline-block;padding:4px 7px;border-radius:6px;background:#f3f5f1;font-size:10px;font-weight:800;color:#69746d;white-space:nowrap}.status-chip.red{background:var(--red-bg);color:var(--red)}.status-chip.amber{background:var(--amber-bg);color:var(--amber)}.stage-cell{max-width:220px;font-weight:700;font-size:11px}.stage-cell small{display:block;color:#9aa39b;font-weight:500;margin-top:3px}.days{font-weight:800;font-size:11px;white-space:nowrap}.days.late{color:var(--red)}.row-action{border:1px solid #dde4db;border-radius:999px;padding:6px 10px;background:#fff;font-size:10px;font-weight:800;white-space:nowrap}.empty{padding:30px 10px;color:var(--muted);text-align:center}
    .side-stack{display:grid;gap:13px;align-content:start}.break-row{display:grid;grid-template-columns:1fr auto;gap:5px;margin:14px 0}.break-row .label{font-size:11px;font-weight:700}.break-row .value{font-weight:800;font-size:11px}.rail{grid-column:1/-1;height:5px;border-radius:99px;background:#f1f3ed;overflow:hidden}.rail i{display:block;height:100%;background:#c8d99d;border-radius:99px}.break-row:first-of-type .rail i{background:var(--green)}.insight{min-height:150px;padding:18px;background:#eeedfb}.insight .badge{background:#fff;color:#656299;border:1px solid #dfdcef}.insight p{font-family:Manrope,sans-serif;font-size:17px;line-height:1.35;font-weight:800;letter-spacing:-.035em;margin:18px 0 0}.insight small{display:block;color:#787697;margin-top:8px;line-height:1.4}
    .back{border:0;background:none;padding:0;color:#657169;font-weight:800;margin-bottom:11px}.detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.detail-head h1{margin:0}.detail-sub{color:#89928a;margin:6px 0 18px}.stepper{display:flex;overflow:auto;gap:0;padding:18px 20px 15px;margin-bottom:13px}.step{min-width:105px;flex:1;position:relative;font-size:10px;color:#a0a8a0}.step:not(:last-child):before{content:"";position:absolute;height:2px;background:#e1e7df;top:9px;left:18px;right:0}.step.done:not(:last-child):before{background:#749475}.step .dot{width:19px;height:19px;border:2px solid #dce3dc;background:#fff;border-radius:50%;position:relative;z-index:1;margin-bottom:8px}.step.done .dot{background:var(--green);border-color:var(--green)}.step.done .dot:after{content:"✓";color:#fff;position:absolute;top:0;left:3px;font-size:11px}.step.now .dot{border-color:var(--red);box-shadow:0 0 0 4px #faece8}.step strong{display:block;color:#46534a;font-size:10px;line-height:1.2}.step.now strong{color:var(--red)}.step span{display:block;margin-top:3px}.tabs{display:flex;background:white;border-radius:999px;width:max-content;padding:3px;margin:0 0 13px;max-width:100%;overflow:auto}.tab{border:0;background:none;padding:8px 13px;border-radius:999px;color:#687269;font-size:11px;font-weight:800;white-space:nowrap}.tab.active{background:var(--green);color:#fff}.detail-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.7fr);gap:13px}.detail-stack{display:grid;gap:13px;align-content:start}.next-card{padding:22px;background:var(--lime);min-height:170px}.next-card h2{font-family:Manrope,sans-serif;font-size:23px;letter-spacing:-.055em;margin:12px 0 6px;max-width:490px}.next-card p{max-width:530px;color:#59664e;line-height:1.5;margin:0 0 15px}.wait-card{padding:21px;background:var(--violet);color:#fff;min-height:170px}.wait-card small{color:#efedff}.wait-card strong{font-family:Manrope,sans-serif;font-size:34px;letter-spacing:-.06em;display:block;margin:12px 0 5px}.wait-card p{margin:0;color:#f0efff;line-height:1.45}.panel{padding:20px}.panel h2{font-family:Manrope,sans-serif;font-size:16px;letter-spacing:-.035em;margin:0 0 14px}.timeline{list-style:none;margin:0;padding:0 0 0 17px;border-left:2px solid #e7ece6}.timeline li{position:relative;padding:0 0 18px 16px}.timeline li:last-child{padding-bottom:0}.timeline li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);position:absolute;left:-22px;top:4px}.timeline li:first-child:before{background:var(--red)}.timeline b{display:block;font-size:12px}.timeline small{display:block;margin-top:3px;color:#8e9890}.timeline p{margin:5px 0 0;color:#68736a;line-height:1.4}.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}.kv:last-child{border:0}.kv span{color:#8a948b}.kv b{text-align:right;max-width:60%}.milestone-list{display:grid;gap:0}.milestone{display:grid;grid-template-columns:minmax(170px,1fr) repeat(3,90px);gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}.milestone.head{color:#9da59d;font-weight:800}.milestone strong{line-height:1.3}.milestone em{font-style:normal;color:var(--red)}.loading{color:#89948c;padding:20px}.hidden{display:none!important}
    @media(max-width:1100px){.shell{grid-template-columns:185px minmax(0,1fr)}.main{padding:28px 22px}.lower{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}}@media(max-width:760px){.shell{display:block}.sidebar{min-height:auto;padding:13px;display:block}.brand{padding:0 4px 10px}.nav-label,.sidebar-bottom{display:none}.nav{display:flex;overflow:auto}.nav button,.nav a{white-space:nowrap;width:auto;padding:8px 10px}.main{padding:23px 15px}.topbar{align-items:flex-start}.top-actions .date-pill{display:none}.kpis{grid-template-columns:1fr 1fr}.risk-card{grid-column:1/-1}.metric-card{min-height:165px}.side-stack,.detail-grid{grid-template-columns:1fr}.topbar h1{font-size:24px}}@media(max-width:460px){.kpis{grid-template-columns:1fr}.risk-card{grid-column:auto}.metric-card{min-height:140px}.top-actions{gap:5px}.primary-btn{padding:9px 11px}.milestone{grid-template-columns:minmax(110px,1fr) repeat(3,62px);font-size:9px}}@media(prefers-reduced-motion:no-preference){.card{animation:rise .42s ease both}.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span> реестр<span style="color:#9bb365">/</span>пульс</div>
    <div class="nav-label">Рабочее пространство</div>
    <nav class="nav" aria-label="Основная навигация">
      <button id="nav-overview" class="active" data-view="overview"><svg viewBox="0 0 20 20"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg> Обзор</button>
      <button id="nav-projects" data-view="projects"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14"/></svg> Проекты <span class="count" id="nav-count">—</span></button>
      <a href="/index.html"><svg viewBox="0 0 20 20"><rect x="3" y="2" width="14" height="16" rx="2"/><path d="M6 7h8M6 11h8M6 15h5"/></svg> Рабочий реестр</a>
    </nav>
    <div class="sidebar-bottom"><a href="/admin">Управление</a><div class="profile"><div class="avatar">Р</div><div><b>Команда реестра</b><small>Тестовый дашборд</small></div></div></div>
  </aside>
  <main class="main" id="app" aria-live="polite"><div class="loading">Загружаем проекты…</div></main>
</div>
<script>
const demoStages=["Обсуждение условий проекта","Подготовка КД","Производство тестовой партии и подготовка КД","Производство тестовой партии завершено","Подготовка КД завершена","Заявка в ГИСП подготовлена","Заявка в ГИСП подана","Камеральная проверка","Камеральная проверка пройдена","Камеральная проверка на одобрении ЦА ТПП","Планирование выездной проверки","Выездная проверка завершена","Акт экспертизы готовится","Акт экспертизы подготовлен","Акт экспертизы на рассмотрении в МПТ","Реестр получен"];
const demoRows=[["Доработка SR",9,null,"ждём ОС от эксперта"],["Вайфай",2,"готовность плат в середине августа",null],["Аудиоплата",2,"готовность плат в середине августа",null],["Планшет",0,null,null],["ОПС",5,null,"ждём ОС от эксперта"],["LED",0,null,"ждём ОС от эксперта"]];
let state={stages:[],projects:[],demo:false,view:'overview',filter:'all',search:'',selected:null,tab:'overview',history:[],milestones:[],detailLoading:false,detailError:''};
const app=document.getElementById('app');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=v=>typeof v==='string'?v.slice(0,10):'';
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const date=v=>v?new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}):'—';
const daysSince=v=>v?Math.max(0,Math.floor((Date.now()-new Date(v).getTime())/86400000)):null;
const isPast=v=>!!v&&iso(v)<today();
function demoData(){const stages=demoStages.map((name,position)=>({id:position+1,name,position}));const projects=demoRows.map(([name,stage_index,timing,comment],i)=>({id:i+1,name,stage_index,stage_id:stage_index+1,status:stages[stage_index].name,timing,comment,updated_at:null,pct:Math.round((stage_index+1)/stages.length*100),stale:false,planned_submission_date:null,planned_registry_received_date:null}));return {stages,projects};}
function group(p){const n=Number(p.stage_index);if(n>=15)return 'Готово';if(n>=12)return 'Экспертиза';if(n>=7)return 'Проверка';if(n>=5)return 'Заявка';return 'Подготовка';}
function risk(p){if(group(p)==='Готово')return null;if(p.stale)return {kind:'stale',label:'Нет обновлений',days:daysSince(p.updated_at),detail:`Статус не обновлялся ${Math.round(Number(p.weeks_since_update||0)*7)} дн.`};if(isPast(p.planned_submission_date)&&Number(p.stage_index)<6)return {kind:'deadline',label:'Просрочена подача',days:daysSince(p.planned_submission_date),detail:`План: ${date(p.planned_submission_date)}`};if(isPast(p.planned_registry_received_date)&&Number(p.stage_index)<15)return {kind:'deadline',label:'Просрочен реестр',days:daysSince(p.planned_registry_received_date),detail:`План: ${date(p.planned_registry_received_date)}`};return null;}
function priority(p){const r=risk(p);if(r)return 0;if(p.comment&&/жд|ожид|задерж|нет|проблем/i.test(p.comment))return 1;return 2;}
function filtered(){return state.projects.filter(p=>{const r=risk(p);const byFilter=state.filter==='all'||(state.filter==='risk'&&r)||(state.filter==='waiting'&&!r&&priority(p)===1)||(state.filter==='active'&&group(p)!=='Готово')||(state.filter==='done'&&group(p)==='Готово');return byFilter&&(!state.search||`${p.name} ${p.status} ${p.comment||''}`.toLowerCase().includes(state.search.toLowerCase()));}).sort((a,b)=>priority(a)-priority(b)||Number(a.stage_index)-Number(b.stage_index)||a.name.localeCompare(b.name,'ru'));}
function sourceNote(){return state.demo?'<div class="source-note demo">Демо-режим: названия и исходные этапы из проекта. Живые сроки и история появятся при подключении к API реестра.</div>':'<div class="source-note">Данные из рабочего реестра · обновляются при открытии страницы</div>';}
function header(title,eyebrow='Операционный обзор'){return `<div class="topbar"><div><div class="eyebrow">${safe(eyebrow)}</div><h1>${safe(title)}</h1></div><div class="top-actions"><span class="date-pill">${date(new Date().toISOString())}</span><button class="icon-btn" data-action="reload" title="Обновить данные" aria-label="Обновить данные">↻</button><a class="primary-btn" href="/index.html">Открыть реестр ↗</a></div></div>${sourceNote()}`;}
function bars(violet=false){const heights=[23,34,31,47,42,58,54,72,64,76,81,88];return `<div class="mini-bars" aria-hidden="true">${heights.map(h=>`<i style="height:${h}%"></i>`).join('')}</div>`;}
function projectRows(){const rows=filtered();if(!rows.length)return '<tr><td colspan="5" class="empty">По этому фильтру проектов нет</td></tr>';return rows.map(p=>{const r=risk(p),waiting=priority(p)===1;const chip=r?`<span class="status-chip red">${safe(r.label)}</span>`:waiting?'<span class="status-chip amber">Ожидание</span>':'<span class="status-chip">В работе</span>';const updated=p.updated_at?`${daysSince(p.updated_at)} дн. назад`:'нет даты';return `<tr data-project="${Number(p.id)}" tabindex="0" role="button" aria-label="Открыть проект ${safe(p.name)}"><td><div class="project-name">${safe(p.name)}</div><div class="project-sub">Проект #${Number(p.id)}</div></td><td>${chip}</td><td class="stage-cell">${safe(p.status||'Без статуса')}<small>${Number(p.stage_index)+1} из ${state.stages.length} этапов</small></td><td class="days ${r?'late':''}">${safe(updated)}</td><td><button class="row-action" data-project="${Number(p.id)}">Подробнее →</button></td></tr>`;}).join('');}
function tableCard(){const count=state.projects.filter(risk).length;return `<section class="card table-card"><div class="section-head"><h2>Требует внимания</h2><button class="link" data-view="projects">Все проекты →</button></div><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">Все ${state.projects.length}</button><button class="filter ${state.filter==='risk'?'active':''}" data-filter="risk">Риск ${count}</button><button class="filter ${state.filter==='waiting'?'active':''}" data-filter="waiting">Ожидание</button><button class="filter ${state.filter==='active'?'active':''}" data-filter="active">В работе</button><button class="filter ${state.filter==='done'?'active':''}" data-filter="done">Готово</button></div><input class="search" id="search" type="search" placeholder="Найти проект или этап…" value="${safe(state.search)}" aria-label="Поиск проектов"><div class="table-wrap"><table class="project-table"><thead><tr><th>Проект</th><th>Сигнал</th><th>Текущий этап</th><th>Обновлено</th><th></th></tr></thead><tbody id="project-rows">${projectRows()}</tbody></table></div></section>`;}
function overview(){const risks=state.projects.filter(risk).length,complete=state.projects.filter(p=>group(p)==='Готово').length,avg=state.projects.length?Math.round(state.projects.reduce((s,p)=>s+Number(p.pct||0),0)/state.projects.length):0;const groups=['Подготовка','Заявка','Проверка','Экспертиза','Готово'].map(label=>({label,n:state.projects.filter(p=>group(p)===label).length}));const max=Math.max(1,...groups.map(x=>x.n));const common=groups.reduce((a,b)=>b.n>a.n?b:a,groups[0]);return `${header('Доброе утро, команда')}<div class="kpis"><section class="card risk-card"><span class="badge">Сегодня</span><div class="risk-number">${risks} ${risks%10===1&&risks%100!==11?'проект':risks%10>=2&&risks%10<=4&&(risks%100<12||risks%100>14)?'проекта':'проектов'} в риске</div><p>Задержка обновления статуса или просроченная плановая дата</p><button data-action="show-risk">Посмотреть проекты →</button></section><section class="card metric-card"><h3>Активных проектов</h3><div><strong>${state.projects.length-complete}</strong><br><small>всего ${state.projects.length} в реестре</small></div>${bars()}</section><section class="card metric-card completion-card"><h3>Средний этап прохождения</h3><div><strong>${avg}%</strong><br><small>${complete} проектов получили запись</small></div>${bars(true)}</section></div><div class="lower">${tableCard()}<div class="side-stack"><section class="card breakdown"><div class="section-head"><h2>Где находятся проекты</h2></div>${groups.map(g=>`<div class="break-row"><span class="label">${g.label}</span><span class="value">${g.n}</span><span class="rail"><i style="width:${g.n/max*100}%"></i></span></div>`).join('')}</section><section class="card insight"><span class="badge">Фокус команды</span><p>${common.n?`Больше всего проектов сейчас на этапе «${common.label.toLowerCase()}».`:'Добавьте проекты, чтобы увидеть распределение.'}</p><small>Сводка рассчитана по текущему этапу каждого проекта.</small></section></div></div>`;}
function projectsView(){return `${header('Все проекты','Рабочий список')}<div class="lower" style="grid-template-columns:1fr">${tableCard()}</div>`;}
function steps(p){const milestones=[0,2,5,6,7,10,12,15].map(i=>state.stages[i]).filter(Boolean);const current=Number(p.stage_index),currentMark=Math.max(0,...milestones.filter(s=>Number(s.position)<=current).map(s=>Number(s.position)));return `<section class="card stepper" aria-label="Этапы проекта">${milestones.map(s=>{const n=Number(s.position),cls=n<currentMark?'done':n===currentMark?'now':'';const short={0:'Условия',2:'Тестовая партия',5:'Заявка готова',6:'Заявка подана',7:'Камеральная',10:'Выездная',12:'Акт экспертизы',15:'Реестр'}[n]||s.name;return `<div class="step ${cls}"><div class="dot"></div><strong>${safe(short)}</strong><span>${n===currentMark?'Сейчас':n<currentMark?'Пройдено':'Впереди'}</span></div>`;}).join('')}</section>`;}
function detail(){const p=state.projects.find(x=>Number(x.id)===state.selected);if(!p){state.view='overview';return overview()}const r=risk(p),next=state.stages.find(s=>Number(s.position)===Number(p.stage_index)+1),days=daysSince(p.updated_at),tabs=['Обзор','Вехи','История'];return `<button class="back" data-action="back">← К обзору</button><div class="detail-head"><h1>${safe(p.name)}</h1>${r?'<span class="status-chip red">В риске</span>':'<span class="status-chip">В работе</span>'}</div><div class="detail-sub">Проект #${Number(p.id)} · ${safe(p.status||'Без статуса')} · ${Number(p.pct||0)}% пути</div>${sourceNote()}${steps(p)}<div class="tabs">${tabs.map((t,i)=>`<button class="tab ${state.tab===['overview','milestones','history'][i]?'active':''}" data-tab="${['overview','milestones','history'][i]}">${t}</button>`).join('')}</div>${detailTab(p,r,next,days)}`;}
function timeline(p){if(state.demo)return '<div class="empty">История доступна при подключении к рабочему API.</div>';if(state.detailLoading)return '<div class="loading">Загружаем историю…</div>';if(state.detailError)return `<div class="error-note">${safe(state.detailError)}</div>`;if(!state.history.length)return '<div class="empty">Записей пока нет.</div>';return `<ol class="timeline">${state.history.map(h=>`<li><b>${safe(h.stage_name||'Статус обновлён')}</b><small>${date(h.effective_date||h.created_at)}</small>${h.comment?`<p>${safe(h.comment)}</p>`:''}${h.timing?`<p>Срок: ${safe(h.timing)}</p>`:''}</li>`).join('')}</ol>`;}
function milestoneBody(){if(state.demo)return '<div class="empty">План, прогноз и факт доступны при подключении к рабочему API.</div>';if(state.detailLoading)return '<div class="loading">Загружаем вехи…</div>';if(state.detailError)return `<div class="error-note">${safe(state.detailError)}</div>`;return `<div class="milestone-list"><div class="milestone head"><span>Этап</span><span>План</span><span>Прогноз</span><span>Факт</span></div>${state.milestones.map(m=>{const delayed=m.baseline_date&&m.forecast_date&&iso(m.forecast_date)>iso(m.baseline_date)&&!m.actual_date;return `<div class="milestone"><strong>${safe(m.stage_name)}</strong><span>${date(m.baseline_date)}</span><span>${delayed?`<em>${date(m.forecast_date)}</em>`:date(m.forecast_date)}</span><span>${date(m.actual_date)}</span></div>`;}).join('')}</div>`;}
function detailTab(p,r,next,days){if(state.tab==='milestones')return `<section class="card panel"><h2>План · прогноз · факт по этапам</h2>${milestoneBody()}</section>`;if(state.tab==='history')return `<section class="card panel"><h2>Хронология изменений</h2>${timeline(p)}</section>`;return `<div class="detail-grid"><div class="detail-stack"><section class="card next-card"><span class="badge">Следующий шаг</span><h2>${safe(next?.name||'Реестровая запись получена')}</h2><p>${safe(p.comment||p.timing||'Проверьте плановую дату и зафиксируйте следующее действие в рабочем реестре.')}</p><a class="primary-btn" href="/index.html">Обновить в реестре ↗</a></section><section class="card panel"><h2>Хронология</h2>${timeline(p)}</section></div><div class="detail-stack"><section class="card wait-card"><small>Текущий сигнал</small><strong>${r?`${r.days??'—'} дн.`:Number(p.pct||0)+'%'}</strong><p>${safe(r?.detail||`Пройдено ${Number(p.stage_index)+1} из ${state.stages.length} этапов`)}</p></section><section class="card panel"><h2>Плановые даты</h2><div class="kv"><span>Подача заявки</span><b>${date(p.planned_submission_date)}</b></div><div class="kv"><span>Получение записи</span><b>${date(p.planned_registry_received_date)}</b></div><div class="kv"><span>Последнее обновление</span><b>${date(p.updated_at)}</b></div><div class="kv"><span>Текущий этап</span><b>${safe(p.status||'—')}</b></div></section></div></div>`;}
function render(){document.getElementById('nav-count').textContent=state.projects.length;document.getElementById('nav-overview').classList.toggle('active',state.view==='overview'||state.view==='detail');document.getElementById('nav-projects').classList.toggle('active',state.view==='projects');app.innerHTML=state.view==='detail'?detail():state.view==='projects'?projectsView():overview();}
async function load(){try{if(location.protocol==='file:')throw new Error('file preview');const response=await fetch('/api/data',{credentials:'same-origin'});const data=await response.json();if(!response.ok||!Array.isArray(data.projects)||!Array.isArray(data.stages))throw new Error(data.error||'Данные недоступны');state.projects=data.projects;state.stages=data.stages;state.demo=false;}catch(e){if(location.protocol==='file:'||['localhost','127.0.0.1'].includes(location.hostname)){Object.assign(state,demoData());state.demo=true;}else{app.innerHTML=`<div class="error-note">Не удалось загрузить данные реестра: ${safe(e.message)}</div><a class="soft-btn" href="/index.html">Вернуться к реестру</a>`;return}}render();}
async function openProject(id){state.selected=Number(id);state.tab='overview';state.view='detail';state.history=[];state.milestones=[];state.detailError='';state.detailLoading=!state.demo;render();window.scrollTo({top:0,behavior:'smooth'});if(state.demo)return;try{const [h,m]=await Promise.all([fetch('/api/history/'+id),fetch('/api/milestones/'+id)]);const hd=await h.json(),md=await m.json();if(!h.ok||!m.ok)throw new Error(hd.error||md.error||'Ошибка загрузки деталей');state.history=hd.history||[];state.milestones=md.milestones||[];}catch(e){state.detailError=e.message}finally{state.detailLoading=false;if(state.view==='detail'&&state.selected===Number(id))render();}}
document.addEventListener('click',e=>{const project=e.target.closest('[data-project]');if(project){openProject(project.dataset.project);return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();return}const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;state.filter='all';render();return}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}const action=e.target.closest('[data-action]');if(!action)return;if(action.dataset.action==='reload')load();if(action.dataset.action==='back'){state.view='overview';render()}if(action.dataset.action==='show-risk'){state.view='projects';state.filter='risk';render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;document.getElementById('project-rows').innerHTML=projectRows()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-project]')){e.preventDefault();openProject(e.target.dataset.project)}});
load();
</script>
</body>
</html>
